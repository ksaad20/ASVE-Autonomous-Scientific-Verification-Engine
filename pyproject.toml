[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asve"
version = "0.0.1"
description = "Automated Scientific Verification Engine: Open-source scientific verification for reproducible computational research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

authors = [
    { name = "Asif Kazi" },
]

keywords = [
    "science",
    "scientific-computing",
    "reproducibility",
    "verification",
    "research",
    "computational-science",
    "scientific-software",
    "peer-review",
    "validation",
    "continuous-integration",
    "research-software",
    "python",
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "networkx>=3.3",
    "pydantic>=2.8",
    "pyyaml>=6.0.2",
    "rich>=13.9",
    "typer>=0.16",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8",
    "black>=25.1",
    "build>=1.2",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "twine>=6.1",
]

docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
]

[project.urls]
Homepage = "https://github.com/yourusername/asve"
Documentation = "https://github.com/yourusername/asve"
Repository = "https://github.com/yourusername/asve"
Issues = "https://github.com/yourusername/asve/issues"
Changelog = "https://github.com/yourusername/asve/releases"

[project.scripts]
asve = "asve.cli:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asve" = ["py.typed"]

[tool.black]
line-length = 88
target-version = [
    "py310",
    "py311",
    "py312",
    "py313",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["asve"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true

# If you still get import-untyped for your own package during transition:
# [[tool.mypy.overrides]]
# module = "asve.*"
# ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src/asve/tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=asve",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/asve"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[tool.bandit]
exclude_dirs = [
    "tests",
    "docs",
]
skips = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
