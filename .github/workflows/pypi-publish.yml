name: Publish ASVE to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and source package
        run: |
          python -m build

      - name: Validate distributions
        run: |
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: asve-release-artifacts
          path: dist/


  install-test:
    name: Verify installation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: asve-release-artifacts
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create clean environment
        run: |
          python -m venv release-env

      - name: Install wheel
        run: |
          source release-env/bin/activate
          pip install dist/*.whl

      - name: Import test
        run: |
          source release-env/bin/activate
          python -c "import asve"

      - name: CLI smoke test
        run: |
          source release-env/bin/activate
          asve --help
          asve --version


  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: install-test

    environment:
      name: pypi
      url: https://pypi.org/p/asve

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: asve-release-artifacts
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1


  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
