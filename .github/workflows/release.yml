name: Release ASVE

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build pytest pytest-cov

      - name: Install project
        run: |
          pip install -e .

      - name: Run tests
        run: |
          pytest --cov=asve --cov-report=term-missing


  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and source distribution
        run: |
          python -m build

      - name: Validate package metadata
        run: |
          twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asve-distributions
          path: dist/


  smoke-test:
    name: Install and smoke test package
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: asve-distributions
          path: dist

      - name: Create clean environment
        run: |
          python -m venv smoke-env

      - name: Install wheel
        run: |
          source smoke-env/bin/activate
          pip install dist/*.whl

      - name: Import test
        run: |
          source smoke-env/bin/activate
          python -c "import asve; print(asve.__version__)"

      - name: CLI test
        run: |
          source smoke-env/bin/activate
          asve --help
          asve --version


  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - smoke-test

    environment:
      name: pypi
      url: https://pypi.org/p/asve

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: asve-distributions
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1


  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
